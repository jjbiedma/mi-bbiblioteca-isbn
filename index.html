<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Lector ISBN - Mi Biblioteca</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #172b3a;
    }

    .contenedor {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 32px;
    }

    .subtitulo {
      color: #7b8791;
      margin-bottom: 24px;
      font-size: 18px;
    }

    .tarjeta {
      background: white;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .visor {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #111;
    }

    video {
      display: block;
      width: 100%;
      min-height: 300px;
      object-fit: cover;
    }

    .guia {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 38%;
      height: 24%;
      border: 3px solid white;
      border-radius: 10px;
      pointer-events: none;
    }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 18px;
      text-align: center;
      background: #eef5f6;
      border-radius: 15px;
    }

    .etiqueta {
      color: #71808a;
      margin-bottom: 7px;
    }

    .isbn {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    #mensaje {
      margin-top: 18px;
      text-align: center;
      color: #71808a;
      line-height: 1.45;
    }

    button {
      display: none;
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #286f80;
      color: white;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>Escanear ISBN</h1>
  <div class="subtitulo">Mi Biblioteca</div>

  <div class="tarjeta">

    <div class="visor">
      <video id="video" playsinline muted></video>
      <div class="guia"></div>
    </div>

    <div id="resultado">
      <div class="etiqueta">ISBN detectado</div>
      <div id="isbnResultado" class="isbn"></div>
    </div>

    <div id="mensaje">
      Apuntá al código de barras de la contratapa.
    </div>

    <button id="reiniciar" onclick="location.reload()">
      Escanear otro libro
    </button>

  </div>

</div>

<script>
  let terminado = false;

  async function iniciar() {

    const mensaje = document.getElementById("mensaje");

    try {

      const hints = new Map();

      hints.set(
        ZXing.DecodeHintType.POSSIBLE_FORMATS,
        [
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.UPC_A
        ]
      );

      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

      const lector = new ZXing.BrowserMultiFormatReader(hints);

      const dispositivos =
        await lector.listVideoInputDevices();

      if (!dispositivos.length) {
        throw new Error("No se encontró ninguna cámara.");
      }

      /*
       * En iPhone normalmente la última cámara de la lista
       * corresponde a una cámara trasera.
       */
      const camara =
        dispositivos[dispositivos.length - 1].deviceId;

      lector.decodeFromVideoDevice(
        camara,
        "video",
        function(resultado, error) {

          if (terminado || !resultado) return;

          const codigo =
            String(resultado.getText() || "")
            .replace(/\D/g, "");

          /*
           * ISBN-13 comienza normalmente con 978 o 979.
           */
          if (
            codigo.length === 13 &&
            (codigo.startsWith("978") ||
             codigo.startsWith("979"))
          ) {

            terminado = true;

            document.getElementById("isbnResultado")
              .textContent = codigo;

            document.getElementById("resultado")
              .style.display = "block";

            document.getElementById("reiniciar")
              .style.display = "block";

            mensaje.textContent =
              "ISBN leído correctamente.";

            lector.reset();
          }
        }
      );

    } catch (error) {

      mensaje.innerHTML =
        "No se pudo iniciar el lector.<br><br>" +
        String(error.message || error);

      console.log(error);
    }
  }

  window.addEventListener("load", iniciar);
</script>

</body>
</html>
