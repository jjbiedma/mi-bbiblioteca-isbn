<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Lector ISBN - Mi Biblioteca</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #172b3a;
    }

    .contenedor {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 32px;
    }

    .subtitulo {
      color: #7b8791;
      margin-bottom: 25px;
      font-size: 18px;
    }

    .tarjeta {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
    }

    #resultado {
      margin-top: 22px;
      padding: 18px;
      background: #eef5f6;
      border-radius: 15px;
      text-align: center;
      display: none;
    }

    .etiqueta {
      font-size: 15px;
      color: #71808a;
      margin-bottom: 7px;
    }

    .isbn {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .mensaje {
      margin-top: 18px;
      color: #71808a;
      text-align: center;
      line-height: 1.4;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #286f80;
      color: white;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>Escanear ISBN</h1>
  <div class="subtitulo">Mi Biblioteca</div>

  <div class="tarjeta">

    <div id="reader"></div>

    <div id="resultado">
      <div class="etiqueta">ISBN detectado</div>
      <div id="isbnResultado" class="isbn"></div>
    </div>

    <div id="mensaje" class="mensaje">
      Permití el acceso a la cámara y apuntá al código de barras del libro.
    </div>

    <button id="reiniciar"
            style="display:none;"
            onclick="reiniciarEscaner()">
      Escanear otro libro
    </button>

  </div>
</div>

<script>

  let scanner;
  let detectado = false;

  function iniciarEscaner() {

    detectado = false;

    scanner = new Html5Qrcode("reader");

    const configuracion = {
      fps: 10,
      qrbox: {
        width: 280,
        height: 120
      }
    };

    scanner.start(
      { facingMode: "environment" },
      configuracion,

      function(codigo) {

        if (detectado) return;

        const isbn = String(codigo)
          .replace(/[^0-9X]/gi, "");

        if (isbn.length !== 13 && isbn.length !== 10) {
          return;
        }

        detectado = true;

        document.getElementById("isbnResultado").textContent = isbn;
        document.getElementById("resultado").style.display = "block";
        document.getElementById("mensaje").textContent =
          "ISBN leído correctamente.";
        document.getElementById("reiniciar").style.display = "block";

        scanner.stop().catch(function() {});
      },

      function() {
        // Los intentos de lectura fallidos se ignoran.
      }
    )

    .catch(function(error) {

      document.getElementById("mensaje").innerHTML =
        "No se pudo abrir la cámara.<br><br>" +
        "Verificá que el navegador tenga permiso para utilizarla.";

      console.log(error);
    });
  }


  function reiniciarEscaner() {

    document.getElementById("resultado").style.display = "none";
    document.getElementById("reiniciar").style.display = "none";

    document.getElementById("mensaje").textContent =
      "Apuntá al código de barras del libro.";

    document.getElementById("reader").innerHTML = "";

    iniciarEscaner();
  }


  window.addEventListener("load", iniciarEscaner);

</script>

</body>
</html>
