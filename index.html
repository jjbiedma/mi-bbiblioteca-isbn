<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Lector ISBN - Mi Biblioteca</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #172b3a;
    }

    .contenedor {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 32px;
    }

    .subtitulo {
      color: #7b8791;
      margin-bottom: 24px;
      font-size: 18px;
    }

    .tarjeta {
      background: white;
      padding: 22px;
      border-radius: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .instruccion {
      text-align: center;
      color: #63727c;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 17px;
      border: 0;
      border-radius: 14px;
      background: #286f80;
      color: white;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    #vistaPrevia {
      display: none;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      margin-top: 20px;
      border-radius: 14px;
    }

    #procesando {
      display: none;
      margin-top: 18px;
      text-align: center;
      color: #63727c;
    }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #eef5f6;
      border-radius: 15px;
      text-align: center;
    }

    .etiqueta {
      color: #71808a;
      margin-bottom: 7px;
    }

    .isbn {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    #error {
      display: none;
      margin-top: 18px;
      padding: 15px;
      background: #fff3f0;
      border-radius: 12px;
      color: #934735;
      line-height: 1.4;
    }

    .reintentar {
      display: none;
      margin-top: 16px;
      background: #e8eef0;
      color: #27434d;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>Escanear ISBN</h1>
  <div class="subtitulo">Mi Biblioteca</div>

  <div class="tarjeta">

    <div class="instruccion">
      Fotografá de cerca el código de barras de la contratapa.<br>
      Procurá que las barras ocupen buena parte de la foto.
    </div>

    <label class="boton" for="fotoISBN">
      📷 Fotografiar código ISBN
    </label>

    <input
      id="fotoISBN"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img id="vistaPrevia" alt="Código ISBN">

    <div id="procesando">
      Analizando código de barras...
    </div>

    <div id="resultado">
      <div class="etiqueta">ISBN detectado</div>
      <div id="isbnResultado" class="isbn"></div>
    </div>

    <div id="error"></div>

    <button
      id="reintentar"
      class="boton reintentar"
      onclick="reiniciar()">
      Intentar otra foto
    </button>

  </div>
</div>

<script>

  const input = document.getElementById("fotoISBN");
  const imagen = document.getElementById("vistaPrevia");
  const procesando = document.getElementById("procesando");
  const resultado = document.getElementById("resultado");
  const isbnResultado = document.getElementById("isbnResultado");
  const errorCaja = document.getElementById("error");
  const reintentar = document.getElementById("reintentar");

  input.addEventListener("change", function(event) {

    const archivo = event.target.files[0];

    if (!archivo) return;

    resultado.style.display = "none";
    errorCaja.style.display = "none";
    reintentar.style.display = "none";

    const url = URL.createObjectURL(archivo);

    imagen.onload = function() {

      imagen.style.display = "block";
      procesando.style.display = "block";

      leerCodigo();
    };

    imagen.src = url;
  });


  async function leerCodigo() {

    try {

      const hints = new Map();

      hints.set(
        ZXing.DecodeHintType.POSSIBLE_FORMATS,
        [
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.UPC_A
        ]
      );

      hints.set(
        ZXing.DecodeHintType.TRY_HARDER,
        true
      );

      const lector =
        new ZXing.BrowserMultiFormatReader(hints);

      const lectura =
        await lector.decodeFromImage(imagen);

      const codigo =
        String(lectura.getText() || "")
          .replace(/\D/g, "");

      procesando.style.display = "none";

      if (
        codigo.length === 13 &&
        (codigo.startsWith("978") ||
         codigo.startsWith("979"))
      ) {

        isbnResultado.textContent = codigo;
        resultado.style.display = "block";

      } else {

        mostrarError(
          "Se detectó un código, pero no parece ser un ISBN-13: " +
          codigo
        );
      }

    } catch (e) {

      procesando.style.display = "none";

      mostrarError(
        "No pude reconocer el ISBN en esta foto. " +
        "Probá acercándote más al código, con buena luz " +
        "y evitando reflejos."
      );

      console.log(e);
    }
  }


  function mostrarError(texto) {

    errorCaja.textContent = texto;
    errorCaja.style.display = "block";
    reintentar.style.display = "block";
  }


  function reiniciar() {

    input.value = "";
    imagen.src = "";
    imagen.style.display = "none";

    resultado.style.display = "none";
    errorCaja.style.display = "none";
    reintentar.style.display = "none";
    procesando.style.display = "none";

    input.click();
  }

</script>

</body>
</html>
